name: Release
on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "name=build-${{ github.run_number }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            manager/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
